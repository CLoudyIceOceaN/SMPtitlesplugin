<svg xmlns="http://www.w3.org/2000/svg" width="500" height="380" viewBox="0 0 500 380" font-family="Menlo, Consolas, monospace">
  <defs>
    <g id="slot">
      <rect width="44" height="44" rx="3" fill="#26282e"/>
      <rect x="2" y="2" width="40" height="40" rx="2" fill="#33363e"/>
    </g>
    <g id="graypane">
      <rect width="44" height="44" rx="3" fill="#26282e"/>
      <rect x="2" y="2" width="40" height="40" rx="2" fill="#33363e"/>
      <rect x="10" y="10" width="24" height="24" rx="3" fill="#6f7480" opacity="0.85"/>
      <rect x="14" y="14" width="16" height="16" rx="2" fill="#8b909c" opacity="0.6"/>
    </g>
    <!-- an enchanted book: purple glowing book with sparkles -->
    <g id="ebook">
      <rect x="10" y="9" width="24" height="26" rx="3" fill="#7a4fd0"/>
      <rect x="10" y="9" width="7" height="26" rx="3" fill="#5c35a8"/>
      <rect x="20" y="15" width="11" height="2.5" fill="#e3d4ff"/>
      <rect x="20" y="20" width="11" height="2.5" fill="#e3d4ff"/>
      <rect x="20" y="25" width="8" height="2.5" fill="#e3d4ff"/>
      <text x="34" y="12" font-size="8" fill="#d8b7ff">&#10022;</text>
      <text x="6" y="34" font-size="8" fill="#d8b7ff">&#10022;</text>
    </g>
  </defs>

  <rect width="500" height="380" fill="#14161c"/>
  <rect x="14" y="12" width="472" height="356" rx="10" fill="#3b3e46" stroke="#20222a" stroke-width="2"/>
  <text x="28" y="40" font-size="15" font-weight="bold" fill="#e8e8e8">Titles</text>

  <!-- 5 rows of slots -->
  <use href="#slot" x="26" y="52"/><use href="#slot" x="74" y="52"/><use href="#slot" x="122" y="52"/><use href="#slot" x="170" y="52"/><use href="#slot" x="218" y="52"/><use href="#slot" x="266" y="52"/><use href="#slot" x="314" y="52"/><use href="#slot" x="362" y="52"/><use href="#slot" x="410" y="52"/>
  <use href="#slot" x="26" y="100"/><use href="#slot" x="74" y="100"/><use href="#slot" x="122" y="100"/><use href="#slot" x="170" y="100"/><use href="#slot" x="218" y="100"/><use href="#slot" x="266" y="100"/><use href="#slot" x="314" y="100"/><use href="#slot" x="362" y="100"/><use href="#slot" x="410" y="100"/>
  <use href="#slot" x="26" y="148"/><use href="#slot" x="74" y="148"/><use href="#slot" x="122" y="148"/><use href="#slot" x="170" y="148"/><use href="#slot" x="218" y="148"/><use href="#slot" x="266" y="148"/><use href="#slot" x="314" y="148"/><use href="#slot" x="362" y="148"/><use href="#slot" x="410" y="148"/>
  <use href="#slot" x="26" y="196"/><use href="#slot" x="74" y="196"/><use href="#slot" x="122" y="196"/><use href="#slot" x="170" y="196"/><use href="#slot" x="218" y="196"/><use href="#slot" x="266" y="196"/><use href="#slot" x="314" y="196"/><use href="#slot" x="362" y="196"/><use href="#slot" x="410" y="196"/>
  <use href="#slot" x="26" y="244"/><use href="#slot" x="74" y="244"/><use href="#slot" x="122" y="244"/><use href="#slot" x="170" y="244"/><use href="#slot" x="218" y="244"/><use href="#slot" x="266" y="244"/><use href="#slot" x="314" y="244"/><use href="#slot" x="362" y="244"/><use href="#slot" x="410" y="244"/>

  <!-- every title is an enchanted book -->
  <use href="#ebook" x="26" y="52"/>
  <use href="#ebook" x="74" y="52"/>
  <use href="#ebook" x="122" y="52"/>
  <use href="#ebook" x="170" y="52"/>

  <!-- cursor hovering the first book -->
  <polygon points="54,80 54,100 59,95 63,103 67,101 63,93 70,93" fill="#ffffff" stroke="#000000" stroke-width="1"/>

  <!-- the hover tooltip: it tells you the title -->
  <g>
    <rect x="62" y="96" width="264" height="140" rx="6" fill="#160d24" opacity="0.97" stroke="#7a4fd0" stroke-width="2"/>
    <text x="76" y="120" font-size="13" font-weight="bold" fill="#ffd964">&#9819; KING &#9819;</text>
    <text x="76" y="141" font-size="12" fill="#aaaaaa">Above your head it shows:</text>
    <text x="90" y="159" font-size="12" font-weight="bold" fill="#ffd964">&#9819; KING &#9819;</text>
    <text x="76" y="183" font-size="12" fill="#aaaaaa">Price: <tspan fill="#55ff55">$50,000</tspan></text>
    <text x="76" y="205" font-size="12" fill="#ffe259">Click <tspan fill="#aaaaaa">to buy it</tspan></text>
  </g>

  <!-- bottom bar -->
  <use href="#graypane" x="26" y="292"/><use href="#graypane" x="74" y="292"/><use href="#graypane" x="122" y="292"/>
  <g> <!-- balance -->
    <use href="#slot" x="170" y="292"/>
    <rect x="180" y="306" width="24" height="8" rx="3" fill="#ffd964"/>
    <rect x="184" y="316" width="24" height="8" rx="3" fill="#eec44f"/>
  </g>
  <g> <!-- your titles chest -->
    <use href="#slot" x="218" y="292"/>
    <rect x="228" y="303" width="24" height="18" rx="2" fill="#a5652c"/>
    <rect x="228" y="309" width="24" height="3" fill="#7d4a1e"/>
    <rect x="237" y="307" width="6" height="7" rx="1" fill="#cfd3da"/>
  </g>
  <use href="#graypane" x="266" y="292"/><use href="#graypane" x="314" y="292"/><use href="#graypane" x="362" y="292"/>
  <g> <!-- next page arrow -->
    <use href="#slot" x="410" y="292"/>
    <polygon points="422,300 438,314 422,328" fill="#ffe259"/>
  </g>

  <text x="240" y="352" font-size="9" fill="#ffd964" text-anchor="middle">your titles</text>
  <text x="432" y="352" font-size="9" fill="#9aa0ac" text-anchor="middle">next page</text>
</svg>
